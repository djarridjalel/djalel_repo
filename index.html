<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Djarri Design Studio — Unlocking your brand's unrealized potential</title>
<meta name="description" content="Djarri Design Studio — brand identity and packaging systems for pharmaceutical and parapharmaceutical companies. Creative direction by Djalel Djarri.">
<meta property="og:title" content="Djarri Design Studio">
<meta property="og:description" content="Unlocking your brand's unrealized potential — brand identity and packaging systems for regulated health markets.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0B;
    --paper:#FFFFFF;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --display:'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;

    /* hero rhythm */
    --edge:clamp(24px, 6vw, 104px);
  }

  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--display);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  img{display:block;}

  /* ============================================================
     HERO
     Seven asset layers + one type layer, composited over a black
     ground. Depth order == DOM order == parallax amplitude order.
     ============================================================ */
  .hero{
    position:relative;
    width:100%;
    height:100svh;
    min-height:min(560px, 100svh);  /* never taller than the viewport itself */
    overflow:hidden;
    background:var(--ink);
    isolation:isolate;          /* contain the blend modes to the hero */
    cursor:default;
  }

  /* every parallax layer is a full-bleed positioning context.
     the transform lives on .pl; the art is placed inside it. */
  .pl{
    position:absolute;
    inset:0;
    will-change:transform;
    transform:translate3d(0,0,0);
    pointer-events:none;
  }

  /* A blended layer must not be promoted to its own GPU layer: once it is,
     some engines composite it without its backdrop and mix-blend-mode is
     silently dropped mid-parallax. These layers therefore take a plain 2D
     transform and no will-change hint. The engine still accelerates the
     move; it just keeps the layer in the same compositing pass as the
     scene behind it, which is what the blend needs. */
  .l2, .shaft{
    will-change:auto;
    transform:translate(0,0);
  }

  /* --- 0 · landscape plate ------------------------------------ */
  .l0 img{
    width:100%; height:100%;
    object-fit:cover; object-position:50% 55%;
    transform:scale(1.02);      /* overscan; travel is clamped to it at runtime */
  }

  /* --- 1 · ring ------------------------------------------------ */
  /* pure white, no blend — unlike the monogram, this one sits on top
     of the scene rather than inverting against it. */
  .l1 img{
    position:absolute;
    left:81%; top:34.5%;
    width:10%; height:auto;
    aspect-ratio:1/1;       /* the source is a true circle */
    min-width:86px;
  }

  /* --- 2 · monogram -------------------------------------------- */
  /* difference blending is the whole effect here: white over the
     bright sky inverts to near-black, white over dark rock stays
     white. it is applied on the layer, not inside the SVG. */
  .l2{mix-blend-mode:difference;}
  .l2 img{
    position:absolute;
    left:64.5%; top:-0.5%;
    height:93%;
    width:auto;
  }

  /* --- 3 · 4 · 6 · light shafts -------------------------------- */
  /* pre-baked at ~33% alpha; screen keeps them reading as light
     rather than as white paint. no extra opacity on top. */
  .shaft{mix-blend-mode:screen;}
  .shaft img{position:absolute; width:auto;}

  .l3 img{left:17.5%; top:-35.5%; height:125%; transform:rotate(-16deg);}
  .l4 img{left:-2%; top:-21.5%; height:134%; transform:rotate(10deg);}
  .l6 img{left:34%; top:-22.5%; height:144%; transform:rotate(-8deg);}

  /* --- 5 · debris ---------------------------------------------- */
  .l5 img{
    position:absolute;
    left:20.5%; top:44.5%;
    width:81%; height:auto;
    aspect-ratio:1800/764;  /* the source plate's own proportion */
  }

  /* --- scrim ---------------------------------------------------
     legibility only. sits under the type, above the art, and does
     not parallax — it belongs to the text, not the scene. */
  .scrim{
    position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(58% 42% at 50% 48%, rgba(0,0,0,.42) 0%, rgba(0,0,0,.18) 45%, rgba(0,0,0,0) 78%),
      linear-gradient(to bottom, rgba(0,0,0,.30) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 62%, rgba(0,0,0,.46) 100%);
  }

  /* --- 7 · type ------------------------------------------------ */
  .type{
    position:absolute; inset:0;
    display:grid;
    grid-template-rows:1fr auto;
    padding:var(--edge);
    will-change:transform;
    transform:translate3d(0,0,0);
  }

  .headline{
    position:relative; top:2.5vh;
    align-self:center;
    justify-self:center;
    text-align:center;
    max-width:min(92%, 24ch);
    margin:0;
    font-weight:300;
    font-size:clamp(1.45rem, 2.7vw, 2.9rem);
    line-height:1.16;
    letter-spacing:-.02em;
    text-wrap:balance;
    text-shadow:0 2px 40px rgba(0,0,0,.45);
  }
  .headline b{font-weight:700;}

  .footrow{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
  }

  .wordmark{
    font-size:clamp(.95rem, 1.5vw, 1.2rem);
    letter-spacing:.06em;
    line-height:1;
    text-shadow:0 2px 24px rgba(0,0,0,.5);
  }
  .wordmark .n{font-weight:700;}
  .wordmark .s{font-weight:300; color:rgba(255,255,255,.72); margin-left:.5em;}

  /* the dual-audience rail: credentials to a client,
     availability to a recruiter. */
  .rail{
    font-family:var(--mono);
    font-size:clamp(.58rem, .78vw, .72rem);
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(255,255,255,.62);
    text-align:right;
    line-height:1.7;
    text-shadow:0 2px 20px rgba(0,0,0,.6);
  }
  .rail a{color:inherit; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.28);}
  .rail a:hover{color:#fff; border-bottom-color:#fff;}

  /* ============================================================
     PORTRAIT
     Keyed to aspect, not width — a 768px iPad in portrait has the
     same problem a phone does, and a phone in landscape does not.

     The plate is reframed rather than just re-cropped: cover-fitting
     3:2 art into a tall frame moves the visible slice to the middle
     of the photo, where the sky is dark. The monogram is a difference
     blend, so a dark backdrop inverts it to light and it dissolves.
     Shifting object-position brings the bright horizon back under it,
     and dropping the shape lower lets it cross both the bright band
     and the dark rock — the two-tone read the desktop composition has.
     ============================================================ */
  @media (max-aspect-ratio:4/5){
    .l0 img{object-position:64% 46%; transform:scale(1.05);}

    /* clear of the headline's right edge */
    .l2 img{left:53%;  top:21%;  height:63%;}
    .l1 img{left:62%;  top:50%;  width:26%;}

    /* light kept left of the monogram so it can't screen over the blend */
    .l3 img{left:-18%; top:-16%; height:92%;  transform:rotate(-19deg);}
    .l4 img{left:4%;   top:-22%; height:84%;  transform:rotate(12deg);}
    .l6 img{left:20%;  top:-12%; height:78%;  transform:rotate(-9deg);}

    .l5 img{left:-22%; top:43%;  width:190%;}

    /* type sits on a controlled ground rather than on rock texture */
    .scrim{
      background:
        radial-gradient(66% 26% at 42% 52%, rgba(0,0,0,.46) 0%, rgba(0,0,0,.16) 52%, rgba(0,0,0,0) 82%),
        linear-gradient(to bottom, rgba(0,0,0,.34) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 46%, rgba(0,0,0,.72) 88%, rgba(0,0,0,.86) 100%);
    }

    .headline{
      top:0;
      justify-self:start;
      text-align:left;
      max-width:16ch;
      font-size:clamp(1.7rem, 7.2vw, 2.6rem);
      line-height:1.12;
      /* balance produces a one-word first line at ~360px; greedy fill
         keeps the rag predictable across every phone width */
      text-wrap:normal;
    }

    .footrow{flex-direction:column; align-items:flex-start; gap:14px;}
    .wordmark{font-size:1.05rem;}
    /* sized so the relocation line holds on one row — a wrapped
       orphan reads as a bug, not a line break */
    .rail{
      text-align:left;
      font-size:.6rem;
      letter-spacing:.08em;
      line-height:1.9;
      color:rgba(255,255,255,.72);
      text-wrap:nowrap;
    }
    .wide-only{display:none;}
  }

  /* very small phones — pull the type in a step */
  @media (max-aspect-ratio:4/5) and (max-width:360px){
    .headline{font-size:1.58rem; max-width:17ch;}
    .rail{font-size:.55rem; letter-spacing:.06em;}
  }

  /* motion is an enhancement; the rest state is the composition. */
  @media (prefers-reduced-motion:reduce){
    .pl,.type{transition:none !important; transform:none !important;}
  }
</style>
</head>
<body>

<header class="hero" id="hero">

  <!-- 0 · landscape plate -->
  <div class="pl l0" data-depth="10" data-overscan="1.02">
    <img src="assets/layer0.webp" alt="" width="1920" height="1280" fetchpriority="high" decoding="async">
  </div>

  <!-- 1 · ring -->
  <div class="pl l1" data-depth="14">
    <img src="assets/layer1.svg" alt="" width="328" height="328" decoding="async">
  </div>

  <!-- 2 · monogram -->
  <div class="pl l2" data-depth="20">
    <img src="assets/layer2.svg" alt="" width="1313" height="1597" decoding="async">
  </div>

  <!-- 3 · light shaft -->
  <div class="pl shaft l3" data-depth="19">
    <img src="assets/layer3.webp" alt="" width="512" height="1158" decoding="async">
  </div>

  <!-- 4 · light shaft -->
  <div class="pl shaft l4" data-depth="27">
    <img src="assets/layer4.webp" alt="" width="512" height="1157" decoding="async">
  </div>

  <!-- 5 · debris -->
  <div class="pl l5" data-depth="31">
    <img src="assets/layer5.webp" alt="" width="1800" height="764" fetchpriority="high" decoding="async">
  </div>

  <!-- 6 · light shaft -->
  <div class="pl shaft l6" data-depth="90">
    <img src="assets/layer6.webp" alt="" width="512" height="1157" decoding="async">
  </div>

  <div class="scrim"></div>

  <!-- 7 · type — front plane, damped amplitude -->
  <div class="type" id="typeLayer" data-depth="17">
    <h1 class="headline"><b>unlocking</b> your <b>brand's</b> unrealized <b>potential</b></h1>
    <div class="footrow">
      <div class="wordmark"><span class="n">DJARRI</span><span class="s">DESIGN&nbsp;STUDIO</span></div>
      <div class="rail">
        Djalel Djarri · Creative Director<br>
        <span class="wide-only">Pharma &amp; parapharma brand systems<br></span>
        Open to relocation — Geneva / Zurich / Lausanne
      </div>
    </div>
  </div>

</header>

<script>
(function(){
  var hero = document.getElementById('hero');
  if(!hero) return;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var fine   = window.matchMedia('(hover: hover) and (pointer: fine)');

  var layers = [].slice.call(hero.querySelectorAll('[data-depth]')).map(function(el){
    return {
      el: el,
      depth: parseFloat(el.dataset.depth) || 0,
      // a full-bleed cover plate can only travel as far as its own overscan;
      // past that it pulls off its edge and reveals the ground behind.
      overscan: parseFloat(el.dataset.overscan) || 0,
      // a blended layer keeps a 2D transform so it is not promoted away
      // from the backdrop it needs to blend with
      blended: getComputedStyle(el).mixBlendMode !== 'normal',
      maxX: Infinity, maxY: Infinity
    };
  });

  function measure(){
    var r = hero.getBoundingClientRect();
    for(var i = 0; i < layers.length; i++){
      var L = layers[i];
      if(!L.overscan){ L.maxX = L.maxY = Infinity; continue; }
      var m = (L.overscan - 1) / 2;
      L.maxX = Math.max(0, m * r.width  - 0.5);
      L.maxY = Math.max(0, m * r.height - 0.5);
    }
  }
  measure();
  addEventListener('resize', measure);

  // target (where the pointer says we should be) and current (where we
  // actually are). easing current toward target is what makes it glide
  // instead of snap — a CSS transition on transform jitters under a
  // high-frequency mousemove.
  var tx = 0, ty = 0, cx = 0, cy = 0;
  var raf = null, EASE = 0.075, EPS = 0.0004;

  function render(){
    cx += (tx - cx) * EASE;
    cy += (ty - cy) * EASE;

    for(var i = 0; i < layers.length; i++){
      var L = layers[i];
      var dx = cx * Math.min(L.depth, L.maxX);
      var dy = cy * Math.min(L.depth, L.maxY);
      L.el.style.transform = L.blended
        ? 'translate('   + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px)'
        : 'translate3d(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px,0)';
    }

    // park the loop once we've effectively arrived
    if(Math.abs(tx - cx) < EPS && Math.abs(ty - cy) < EPS){
      cx = tx; cy = ty; raf = null; return;
    }
    raf = requestAnimationFrame(render);
  }

  function kick(){ if(raf === null) raf = requestAnimationFrame(render); }

  function onMove(e){
    var r = hero.getBoundingClientRect();
    tx = ((e.clientX - r.left) / r.width  - 0.5) * 2;   // -1 … 1
    ty = ((e.clientY - r.top)  / r.height - 0.5) * 2;
    kick();
  }

  function onLeave(){ tx = 0; ty = 0; kick(); }

  function enable(){
    hero.addEventListener('mousemove', onMove);
    hero.addEventListener('mouseleave', onLeave);
  }
  function disable(){
    hero.removeEventListener('mousemove', onMove);
    hero.removeEventListener('mouseleave', onLeave);
    tx = 0; ty = 0; kick();
  }

  function sync(){
    if(fine.matches && !reduce.matches) enable(); else disable();
  }

  sync();
  (reduce.addEventListener ? reduce.addEventListener('change', sync) : reduce.addListener(sync));
  (fine.addEventListener   ? fine.addEventListener('change', sync)   : fine.addListener(sync));
})();
</script>

</body>
</html>

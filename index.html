<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Djarri Design Studio — Unlocking your brand's unrealized potential</title>
<meta name="description" content="Djarri Design Studio — brand identity and packaging systems for pharmaceutical and parapharmaceutical companies. Creative direction by Djalel Djarri.">
<meta property="og:title" content="Djarri Design Studio">
<meta property="og:description" content="Unlocking your brand's unrealized potential — brand identity and packaging systems for regulated health markets.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0B;
    --paper:#FFFFFF;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --display:'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;

    /* hero rhythm */
    --edge:clamp(24px, 6vw, 104px);
  }

  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--display);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  img{display:block;}

  /* ============================================================
     HERO
     Seven asset layers + one type layer, composited over a black
     ground. Depth order == DOM order == parallax amplitude order.
     ============================================================ */
  .hero{
    position:relative;
    width:100%;
    height:100svh;
    min-height:min(560px, 100svh);  /* never taller than the viewport itself */
    overflow:hidden;
    background:var(--ink);
    isolation:isolate;          /* contain the blend modes to the hero */
    cursor:default;
  }

  /* every parallax layer is a full-bleed positioning context.
     the transform lives on .pl; the art is placed inside it. */
  .pl{
    position:absolute;
    inset:0;
    will-change:transform;
    transform:translate3d(0,0,0);
    pointer-events:none;
  }

  /* A blended layer must not be promoted to its own GPU layer: once it is,
     some engines composite it without its backdrop and mix-blend-mode is
     silently dropped mid-parallax. These layers therefore take a plain 2D
     transform and no will-change hint. The engine still accelerates the
     move; it just keeps the layer in the same compositing pass as the
     scene behind it, which is what the blend needs. */
  .l2, .shaft{
    will-change:auto;
    transform:translate(0,0);
  }

  /* --- 0 · landscape plate ------------------------------------ */
  .l0 img{
    width:100%; height:100%;
    object-fit:cover; object-position:50% 55%;
    transform:scale(1.18);      /* overscan; travel is clamped to it at runtime */
  }

  /* --- 1 · ring ------------------------------------------------ */
  /* pure white, no blend — unlike the monogram, this one sits on top
     of the scene rather than inverting against it.
     The ring is also the one layer that turns: its plane pivots to face
     the pointer, so the circle foreshortens into an ellipse as the
     cursor moves off its axis. Perspective lives on the layer, the
     rotation on the image. */
  .l1{perspective:900px;}
  .l1 img{
    transform:rotateY(var(--ring-ry,0deg)) rotateX(var(--ring-rx,0deg));
    transform-origin:50% 50%;
    backface-visibility:visible;
    position:absolute;
    left:79.5%; top:35.5%;
    width:10%; height:auto;
    aspect-ratio:1/1;       /* the source is a true circle */
    min-width:86px;
  }

  /* --- 2 · monogram -------------------------------------------- */
  /* difference blending is the whole effect here: white over the
     bright sky inverts to near-black, white over dark rock stays
     white. it is applied on the layer, not inside the SVG. */
  .l2{mix-blend-mode:difference;}
  .l2 img{
    position:absolute;
    left:64.5%; top:-0.5%;
    height:93%;
    width:auto;
  }

  /* --- 3 · 4 · 6 · light shafts -------------------------------- */
  /* pre-baked at ~33% alpha; screen keeps them reading as light
     rather than as white paint. no extra opacity on top. */
  .shaft{mix-blend-mode:screen;}
  .shaft img{position:absolute; width:auto;}

  .l3 img{left:18%;   top:-26.5%; height:125%; transform:rotate(-16deg);}
  .l4 img{left:-3.5%; top:-36.5%; height:134%; transform:rotate(10deg);}
  .l6 img{left:51%;   top:-22.5%; height:144%; transform:rotate(-8deg);}

  /* --- 5 · debris ---------------------------------------------- */
  .l5 img{
    position:absolute;
    left:21.5%; top:44.5%;
    width:81%; height:auto;
    aspect-ratio:1800/764;  /* the source plate's own proportion */
  }

  /* --- scrim ---------------------------------------------------
     legibility only. sits under the type, above the art, and does
     not parallax — it belongs to the text, not the scene. */
  .scrim{
    position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(58% 42% at 50% 48%, rgba(0,0,0,.42) 0%, rgba(0,0,0,.18) 45%, rgba(0,0,0,0) 78%),
      linear-gradient(to bottom, rgba(0,0,0,.30) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 62%, rgba(0,0,0,.46) 100%);
  }

  /* --- 7 · type ------------------------------------------------ */
  .type{
    position:absolute; inset:0;
    display:grid;
    grid-template-rows:1fr auto;
    padding:var(--edge);
    will-change:transform;
    transform:translate3d(0,0,0);
  }

  .headline{
    position:relative; top:2.5vh;
    align-self:center;
    justify-self:center;
    text-align:center;
    max-width:min(92%, 24ch);
    margin:0;
    font-weight:300;
    font-size:clamp(1.45rem, 2.7vw, 2.9rem);
    line-height:1.16;
    letter-spacing:-.02em;
    text-wrap:balance;
    text-shadow:0 2px 40px rgba(0,0,0,.45);
  }
  .headline b{font-weight:700;}

  .footrow{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
  }

  .wordmark{
    font-size:clamp(.95rem, 1.5vw, 1.2rem);
    letter-spacing:.06em;
    line-height:1;
    text-shadow:0 2px 24px rgba(0,0,0,.5);
  }
  .wordmark .n{font-weight:700;}
  .wordmark .s{font-weight:300; color:rgba(255,255,255,.72); margin-left:.5em;}

  /* the dual-audience rail: credentials to a client,
     availability to a recruiter. */
  .rail{
    font-family:var(--mono);
    font-size:clamp(.58rem, .78vw, .72rem);
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(255,255,255,.62);
    text-align:right;
    line-height:1.7;
    text-shadow:0 2px 20px rgba(0,0,0,.6);
  }
  .rail a{color:inherit; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.28);}
  .rail a:hover{color:#fff; border-bottom-color:#fff;}

  /* --- scroll cue ----------------------------------------------
     Rides the pointer and inverts against whatever it crosses, the
     same difference blend the monogram uses. It lives inside the hero
     so it cannot outlive the section, and like every blended layer it
     stays off the GPU's own compositor pass. */
  .scrollcue{
    position:absolute; left:0; top:0;
    display:flex; align-items:center; gap:8px;
    font-family:var(--mono);
    font-size:.62rem; letter-spacing:.22em; text-transform:uppercase;
    color:#fff;
    mix-blend-mode:difference;
    pointer-events:none;
    opacity:0;
    transition:opacity .35s ease;
    will-change:auto;
    white-space:nowrap;
  }
  .scrollcue.on{opacity:1;}
  .scrollcue .arw{
    display:inline-block;
    animation:cuebob 1.9s ease-in-out infinite;
  }
  @keyframes cuebob{
    0%,100%{transform:translateY(-2px);}
    50%    {transform:translateY(2px);}
  }
  @media (prefers-reduced-motion:reduce){
    .scrollcue{display:none;}
  }

  /* ============================================================
     CLIENT STRIP
     A fifth of the hero's height, white, with the marks tracking
     left-to-right on a loop. Every slot is the same width so the
     rhythm stays even whatever shape each mark is; the artwork is
     centred inside its slot rather than filling it.
     ============================================================ */
  .clients{
    height:20svh;
    min-height:96px;
    background:var(--paper);
    overflow:hidden;
    display:flex;
    align-items:center;
  }
  .marquee{
    width:100%;
    overflow:hidden;
    /* soften the entry and exit so marks don't pop at the edges */
    -webkit-mask-image:linear-gradient(to right, transparent, #000 6%, #000 94%, transparent);
            mask-image:linear-gradient(to right, transparent, #000 6%, #000 94%, transparent);
  }
  .track{
    display:flex;
    align-items:center;
    width:max-content;
    animation:marquee 38s linear infinite;
    will-change:transform;
  }
  /* the spacing is a margin on each slot, not a gap on the track: with a
     gap the duplicated half is not exactly 50% of the width and the loop
     drifts a pixel each cycle. */
  .logo{
    flex:0 0 auto;
    width:clamp(96px, 11vw, 156px);
    margin-right:clamp(32px, 5vw, 76px);
    display:grid;
    place-items:center;
  }
  .logo img{max-width:100%; max-height:56%; object-fit:contain;}
  @keyframes marquee{
    from{transform:translateX(-50%);}
    to  {transform:translateX(0);}
  }
  .clients:hover .track{animation-play-state:paused;}
  @media (prefers-reduced-motion:reduce){
    .track{animation:none;}
    .marquee{overflow-x:auto;}
  }

  /* ============================================================
     PORTRAIT
     Keyed to aspect, not width — a 768px iPad in portrait has the
     same problem a phone does, and a phone in landscape does not.

     The plate is reframed rather than just re-cropped: cover-fitting
     3:2 art into a tall frame moves the visible slice to the middle
     of the photo, where the sky is dark. The monogram is a difference
     blend, so a dark backdrop inverts it to light and it dissolves.
     Shifting object-position brings the bright horizon back under it,
     and dropping the shape lower lets it cross both the bright band
     and the dark rock — the two-tone read the desktop composition has.
     ============================================================ */
  @media (max-aspect-ratio:4/5){
    .l0 img{object-position:64% 46%; transform:scale(1.4);}

    .l2 img{left:47.5%; top:-1.5%; height:63%;}
    .l1 img{left:71%;   top:22.5%; width:18%;}

    .l3 img{left:-18%;  top:-16%;  height:92%; transform:rotate(-19deg);}
    .l4 img{left:4%;    top:-22%;  height:84%; transform:rotate(12deg);}
    .l6 img{left:20%;   top:-12%;  height:78%; transform:rotate(-9deg);}

    .l5 img{left:3.5%;  top:75.5%; width:169%;}

    /* type sits on a controlled ground rather than on rock texture */
    .scrim{
      background:
        radial-gradient(66% 26% at 42% 52%, rgba(0,0,0,.46) 0%, rgba(0,0,0,.16) 52%, rgba(0,0,0,0) 82%),
        linear-gradient(to bottom, rgba(0,0,0,.34) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 46%, rgba(0,0,0,.72) 88%, rgba(0,0,0,.86) 100%);
    }

    .headline{
      top:0;
      justify-self:start;
      text-align:left;
      max-width:16ch;
      font-size:clamp(1.7rem, 7.2vw, 2.6rem);
      line-height:1.12;
      /* balance produces a one-word first line at ~360px; greedy fill
         keeps the rag predictable across every phone width */
      text-wrap:normal;
    }

    .footrow{flex-direction:column; align-items:flex-start; gap:14px;}
    .wordmark{font-size:1.05rem;}
    /* sized so the relocation line holds on one row — a wrapped
       orphan reads as a bug, not a line break */
    .rail{
      text-align:left;
      font-size:.6rem;
      letter-spacing:.08em;
      line-height:1.9;
      color:rgba(255,255,255,.72);
      text-wrap:nowrap;
    }
    .wide-only{display:none;}
  }

  /* ------------------------------------------------------------
     PHONE
     A phone and a tablet are both portrait but not the same canvas:
     roughly 0.42–0.47 against 0.66–0.75. The block above holds for
     both; these four layers are re-placed for the narrower one.
     ------------------------------------------------------------ */
  @media (max-aspect-ratio:3/5){
    .l0 img{object-position:75.5% 46%;}
    .l1 img{left:78%;  top:23.5%; width:27%;}
    .l4 img{left:-11%; top:-22%;  height:84%; transform:rotate(12deg);}
    /* the plate is 2.36:1 — in a 0.46 frame it never reads as a burst */
    .l5{display:none;}
  }

  /* very small phones — pull the type in a step */
  @media (max-aspect-ratio:4/5) and (max-width:360px){
    .headline{font-size:1.58rem; max-width:17ch;}
    .rail{font-size:.55rem; letter-spacing:.06em;}
  }

  /* motion is an enhancement; the rest state is the composition. */
  @media (prefers-reduced-motion:reduce){
    .pl,.type{transition:none !important; transform:none !important;}
  }
</style>
</head>
<body>

<script>
(function(){
  var hero = document.getElementById('hero');
  if(!hero) return;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var fine   = window.matchMedia('(hover: hover) and (pointer: fine)');

  var ringImg = hero.querySelector('.l1 img');
  var cue     = document.getElementById('scrollcue');
  var ringCx = 0, ringCy = 0;

  // how far in front of the plate the pointer is treated as sitting. the
  // ring turns to face that point, so a smaller number means a sharper
  // turn for the same cursor travel.
  var VIEW_DEPTH = 0.62, MAX_TILT = 52;

  var layers = [].slice.call(hero.querySelectorAll('[data-depth]')).map(function(el){
    return {
      el: el,
      depth: parseFloat(el.dataset.depth) || 0,
      // a full-bleed cover plate can only travel as far as its own overscan;
      // past that it pulls off its edge and reveals the ground behind.
      overscan: parseFloat(el.dataset.overscan) || 0,
      // a blended layer keeps a 2D transform so it is not promoted away
      // from the backdrop it needs to blend with
      blended: getComputedStyle(el).mixBlendMode !== 'normal',
      maxX: Infinity, maxY: Infinity
    };
  });

  function measure(){
    var r = hero.getBoundingClientRect();
    for(var i = 0; i < layers.length; i++){
      var L = layers[i];
      if(!L.overscan){ L.maxX = L.maxY = Infinity; continue; }
      var m = (L.overscan - 1) / 2;
      L.maxX = Math.max(0, m * r.width  - 0.5);
      L.maxY = Math.max(0, m * r.height - 0.5);
    }
    if(ringImg){
      var q = ringImg.getBoundingClientRect();
      ringCx = q.left - r.left + q.width  / 2;
      ringCy = q.top  - r.top  + q.height / 2;
    }
  }
  measure();
  addEventListener('resize', measure);

  // target (where the pointer says we should be) and current (where we
  // actually are). easing current toward target is what makes it glide
  // instead of snap — a CSS transition on transform jitters under a
  // high-frequency mousemove.
  var tx = 0, ty = 0, cx = 0, cy = 0;
  // ring tilt and the pointer-anchored cue ride the same loop
  var tRX = 0, tRY = 0, cRX = 0, cRY = 0;
  var tCX = 0, tCY = 0, cCX = 0, cCY = 0, cueSeeded = false;
  var raf = null, EASE = 0.075, CUE_EASE = 0.16, EPS = 0.0004;

  function render(){
    cx += (tx - cx) * EASE;
    cy += (ty - cy) * EASE;

    for(var i = 0; i < layers.length; i++){
      var L = layers[i];
      var dx = cx * Math.min(L.depth, L.maxX);
      var dy = cy * Math.min(L.depth, L.maxY);
      L.el.style.transform = L.blended
        ? 'translate('   + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px)'
        : 'translate3d(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px,0)';
    }

    // the ring's plane turns to face the pointer: a circle seen square-on
    // when the cursor is on its axis, foreshortening to an ellipse as it
    // moves off. rotateY carries the horizontal swing, rotateX the vertical.
    if(ringImg){
      cRX += (tRX - cRX) * EASE;
      cRY += (tRY - cRY) * EASE;
      ringImg.style.setProperty('--ring-rx', cRX.toFixed(2) + 'deg');
      ringImg.style.setProperty('--ring-ry', cRY.toFixed(2) + 'deg');
    }

    if(cue){
      cCX += (tCX - cCX) * CUE_EASE;
      cCY += (tCY - cCY) * CUE_EASE;
      cue.style.transform = 'translate(' + cCX.toFixed(1) + 'px,' + cCY.toFixed(1) + 'px)';
    }

    // park the loop once we've effectively arrived
    var settled = Math.abs(tx - cx) < EPS && Math.abs(ty - cy) < EPS &&
                  Math.abs(tRX - cRX) < 0.02 && Math.abs(tRY - cRY) < 0.02 &&
                  Math.abs(tCX - cCX) < 0.3  && Math.abs(tCY - cCY) < 0.3;
    if(settled){
      cx = tx; cy = ty; cRX = tRX; cRY = tRY; cCX = tCX; cCY = tCY;
      raf = null; return;
    }
    raf = requestAnimationFrame(render);
  }

  function kick(){ if(raf === null) raf = requestAnimationFrame(render); }

  function clamp(v, m){ return v < -m ? -m : (v > m ? m : v); }

  function onMove(e){
    var r = hero.getBoundingClientRect();
    var px = e.clientX - r.left, py = e.clientY - r.top;

    tx = (px / r.width  - 0.5) * 2;   // -1 … 1
    ty = (py / r.height - 0.5) * 2;

    var d = r.width * VIEW_DEPTH;
    tRY =  clamp(Math.atan2(px - ringCx, d) * 180 / Math.PI, MAX_TILT);
    tRX = -clamp(Math.atan2(py - ringCy, d) * 180 / Math.PI, MAX_TILT);

    tCX = px + 22; tCY = py + 20;
    if(!cueSeeded){ cCX = tCX; cCY = tCY; cueSeeded = true; }  // no fly-in from 0,0
    if(cue) cue.classList.add('on');

    kick();
  }

  function onLeave(){
    tx = 0; ty = 0; tRX = 0; tRY = 0;
    if(cue) cue.classList.remove('on');
    kick();
  }

  function enable(){
    hero.addEventListener('mousemove', onMove);
    hero.addEventListener('mouseleave', onLeave);
  }
  function disable(){
    hero.removeEventListener('mousemove', onMove);
    hero.removeEventListener('mouseleave', onLeave);
    tx = 0; ty = 0; tRX = 0; tRY = 0;
    if(cue) cue.classList.remove('on');
    cueSeeded = false;
    kick();
  }

  function sync(){
    if(fine.matches && !reduce.matches) enable(); else disable();
  }

  sync();
  (reduce.addEventListener ? reduce.addEventListener('change', sync) : reduce.addListener(sync));
  (fine.addEventListener   ? fine.addEventListener('change', sync)   : fine.addListener(sync));
})();
</script>

</body>
</html>

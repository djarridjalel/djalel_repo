<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/alexandria/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/readex-pro/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/cairo/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/noto-kufi-arabic/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/rubik/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/vazirmatn/index.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;background:url(burst_0.6.jpg) center/cover}
.glass{position:absolute;right:70px;top:60px;bottom:60px;width:1010px;border-radius:30px;background:rgba(244,243,239,0.72);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);box-shadow:0 30px 80px rgba(0,0,0,.15);padding:40px 56px;display:flex;flex-direction:column;justify-content:space-between;color:#0a0a0b}
.name{font-family:"IBM Plex Mono",monospace;direction:ltr;text-align:left;font-size:30px;letter-spacing:.04em;color:#e30613;font-weight:600}
.row{display:flex;align-items:baseline;gap:30px}
.row b{font:500 22px monospace;direction:ltr;color:#5c5c64;width:56px;flex:none}
.row span{font-size:84px;line-height:1.25;white-space:nowrap}
</style></head><body><div class="glass"><div class="name" id="n"></div><div id="rows"></div></div>
<script>
const f=new URLSearchParams(location.search).get('f');
document.getElementById('n').textContent=f.replace(' Variable','');
const text=['نتيجة مطابقة لمنتجك.','أظهِر أفضل زاوية.','مجانًا','مولّد مخططات القطع','بلا تخمين.'];
document.getElementById('rows').innerHTML=[200,400,600,800,900].map((w,i)=>`<div class="row"><b>${w}</b><span style="font-family:'${f}';font-weight:${w};font-variation-settings:'wght' ${w}">${text[i]}</span></div>`).join('');
document.fonts.ready.then(()=>window.ok=1);
</script></body></html>
